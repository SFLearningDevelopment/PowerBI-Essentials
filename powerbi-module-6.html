    badge: '',
    content: `
<p><strong>Power BI Service</strong> is the cloud-based platform (app.powerbi.com) for publishing, sharing, and governing Power BI content. Understanding its structure is essential for moving reports from desktop to production.</p>
<h3>My Workspace</h3>
<p>Every Power BI user has a personal <strong>My Workspace</strong> — a private space where you can publish and test reports without anyone else seeing them. Content in My Workspace cannot be shared with others (except by sharing individual report links). It is <em>not</em> suitable for team or organisational content.</p>
<h3>Shared Workspaces</h3>
<p>Shared workspaces (previously called "app workspaces") are collaborative spaces for teams. Multiple users with the right roles can view, edit, and publish content. This is where all production content lives.</p>
<h3>Workspace Roles</h3>
<p>Each workspace member is assigned one of four roles:</p>
<ul>
  <li><strong>Admin</strong> — full control: add/remove members, change roles, delete the workspace, publish apps, and edit all content.</li>
  <li><strong>Member</strong> — can add/remove members (except Admins), publish and update apps, edit and publish reports and datasets.</li>
  <li><strong>Contributor</strong> — can create, edit, and delete content in the workspace but cannot publish apps or manage membership.</li>
  <li><strong>Viewer</strong> — read-only access. Can view all content in the workspace but cannot edit, publish, or download data.</li>
</ul>
<h3>Workspace vs. App Audience</h3>
<p>Workspaces are for <em>content creators and collaborators</em>. Apps (published from workspaces) are for <em>content consumers</em>. A report author works in the workspace; an end user receives the curated App. This separation allows creators to iterate on content in the workspace without disrupting what consumers see in the App.</p>
<div class="callout callout-info"><strong>Workspace licences:</strong> Free Power BI users can only work in My Workspace. A Power BI Pro licence (or Premium Per User licence) is required to publish to shared workspaces, collaborate, and share content with others.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>Which workspace role can add or remove other members but cannot change Admin-level roles?</li><li>Why is My Workspace not suitable for sharing team content?</li><li>What licence is required to publish content to a shared workspace?</li></ul></div>`

    content: `
<p>Getting content from Power BI Desktop to colleagues requires understanding what "publishing" produces, how sharing works, and what permissions control who sees what.</p>
<h3>What Publishing Does</h3>
<p>When you publish from Desktop (Home → Publish → select workspace), the Service creates two separate artefacts:</p>
<ul>
  <li><strong>Dataset</strong> — the data model: all tables, relationships, measures, and Import data. This is an independent object that can be connected to by multiple reports.</li>
  <li><strong>Report</strong> — the visual layout: all pages, charts, and formatting. The report depends on the dataset for data.</li>
</ul>
<p>Publishing again (to the same workspace, same name) <em>replaces</em> both artefacts. You can also update the dataset and report independently — republish only the report without touching the dataset by using "Save As" flows or by updating report-only features.</p>
<h3>Sharing Methods</h3>
<ul>
  <li><strong>Share a report link</strong> — Report → Share → copy link or enter email addresses. Recipients can view the report (if they have a Pro licence or the workspace is in Premium capacity). They cannot edit it unless given workspace access.</li>
  <li><strong>Embed in SharePoint / Teams</strong> — File → Embed report → SharePoint Online or Microsoft Teams. The report appears inline in SharePoint or Teams tabs.</li>
  <li><strong>Publish to Web</strong> — File → Embed report → Publish to web. Creates a public iframe embed accessible to anyone on the internet with no authentication. Use only for truly public data.</li>
  <li><strong>Power BI App</strong> — the preferred distribution method for large audiences. See Section 3.</li>
</ul>
<h3>Scheduled Refresh</h3>
<p>Import datasets go stale after publishing. Dataset settings → Scheduled Refresh → set frequency (up to 8 times/day for Pro, 48 times for Premium). Requires a <strong>Data Gateway</strong> if the source is on-premises. Cloud-to-cloud sources (Azure SQL, SharePoint Online) refresh without a gateway.</p>
<div class="callout callout-warn"><strong>Gateway requirement:</strong> Local CSV or Excel files on your laptop cannot be refreshed from the Service without a gateway — Power BI Service cannot reach your local file system. Move files to SharePoint Online or OneDrive for gateway-free cloud refresh.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What two objects are created in the Service when you publish from Desktop?</li><li>Which sharing method makes a report publicly accessible to anyone on the internet?</li><li>What is required to refresh a dataset built on a local SQL Server database from Power BI Service?</li></ul></div>`

<p>A <strong>Power BI App</strong> is a curated, published package of reports and dashboards distributed from a workspace to a defined audience. Apps are the recommended way to distribute content to large groups of end users.</p>
<h3>App vs. Workspace</h3>
<ul>
  <li><strong>Workspace</strong> — the development and collaboration area. Contributors and members work here. Content can be in draft, broken, or in progress. Direct workspace access should be limited to the team building the content.</li>
  <li><strong>App</strong> — the published, curated view of selected content from the workspace. End users interact only with the App — they see a stable, reviewed set of reports, not the work-in-progress workspace content.</li>
</ul>
<h3>Publishing an App</h3>
<ol>
  <li>In the workspace, click <strong>Create app</strong> (top-right button).</li>
  <li><strong>Setup tab:</strong> Enter the app name, description, and support contact. Upload an optional logo.</li>
  <li><strong>Content tab:</strong> Select which reports and dashboards from the workspace to include in the App. Reorder them to define the navigation menu.</li>
  <li><strong>Audience tab:</strong> Define who can access the App. Options: specific users or groups (by email), the entire organisation, or security groups. Users who are not in the audience cannot see the App.</li>
  <li>Click <strong>Publish app</strong>.</li>
</ol>
<h3>Updating an App</h3>
<p>Workspace content changes (new measures, updated visuals) are <em>not</em> automatically reflected in the App. You must explicitly <strong>Update app</strong> (same button, now labeled "Update app") to push changes to the App audience. This allows you to iterate in the workspace and release to users on a controlled schedule.</p>
<h3>Multiple Audiences</h3>
<p>In Power BI Premium, you can define multiple app audiences with different report visibility. Sales can see the Sales Dashboard; Finance can see the Financial Reports. Both share the same workspace but receive tailored App navigation.</p>
<div class="callout callout-tip"><strong>Best practice:</strong> Publish the App to users instead of giving them direct workspace access. This keeps the workspace clean for authors and prevents users from accidentally editing content.</div>

<p><strong>Row Level Security (RLS)</strong> restricts which data rows a specific user can see when they open a report. With RLS, one report can serve many audiences — each user sees only the data they are authorised to view.</p>
<h3>Why RLS Matters</h3>
<p>Without RLS, every user who has access to a report sees all rows in every table. This is a data governance and privacy problem — a sales manager in the North region should not see revenue data from the South or East regions.</p>
<p>RLS solves this by filtering the data model at query time — before any visuals are rendered. The filter is invisible to users; they simply see less data without knowing other data exists.</p>
<h3>Static vs. Dynamic RLS</h3>
<ul>
  <li><strong>Static RLS</strong> — a fixed DAX filter that shows one specific segment of data to a role. "NorthRegionUsers" can only see rows where region = "North". Every user assigned to this role sees the same static filter. Simple to implement but requires one role per segment.</li>
  <li><strong>Dynamic RLS</strong> — the filter uses the <strong>current user's identity</strong> (their login email) to determine what data they can see. One role covers all users — the filter adapts based on who is logged in. Requires a user-permission mapping table in the model.</li>
</ul>
<h3>RLS Concepts</h3>
<ul>
  <li><strong>Role</strong> — a named set of table filters defined in Desktop (Modeling → Manage Roles). A role can have filters on multiple tables.</li>
  <li><strong>Rule</strong> — the DAX filter expression applied to a table within a role (e.g. <span class="inline-code">[region] = "North"</span>).</li>
  <li><strong>Role assignment</strong> — in the Service, you assign users (by email) or security groups to roles. Assignment is done on the dataset, not the report.</li>
</ul>
<div class="callout callout-info"><strong>Who is exempt from RLS:</strong> Workspace Admins and Members are exempt — they see all data regardless of role assignment. Only Viewers and external users are restricted by RLS. Test RLS using "View as" in Desktop or the Service (not as an Admin).</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the difference between static and dynamic RLS?</li><li>Which workspace roles are exempt from RLS filters?</li><li>Where in Power BI Service do you assign users to RLS roles?</li></ul></div>`
  },

<p>RLS is implemented in two steps: (1) define roles and DAX filter rules in Desktop, then (2) assign users to roles in the Service after publishing.</p>
<h3>Step 1 — Define Roles in Desktop</h3>
<p>Modeling tab → <strong>Manage Roles</strong> → <strong>Create</strong> → name the role → select the table → enter a DAX filter expression in the filter text box.</p>
<h4>Static Role (one fixed value)</h4>
<pre><code>-- Role: "NorthRegion"
-- Applied to table: dim_customers (or fact_sales if region is there)
[region] = "North"</code></pre>
<h4>Dynamic Role (user-based, uses USERPRINCIPALNAME())</h4>
<pre><code>-- Role: "RegionByUser"
-- Applied to table: user_permissions (a mapping table: email → region)
[user_email] = USERPRINCIPALNAME()</code></pre>
<p>The <span class="inline-code">USERPRINCIPALNAME()</span> function returns the email address of the currently logged-in user (e.g. "alice@sourcefuse.com"). The filter restricts the user_permissions table to show only rows matching Alice's email. Because user_permissions is related to dim_customers via region, the filter propagates — Alice sees only regions she is authorised for.</p>

let _uid = null, _completed = [];

document.getElementById('signin-btn').addEventListener('click', () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
    document.getElementById('ep-error').textContent = e.message||'Sign-in failed.';
    document.getElementById('ep-error').style.display='block';
  });
});
document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!user.email||!user.email.endsWith('@sourcefuse.com')) {
      document.getElementById('ep-error').textContent='Only @sourcefuse.com accounts are allowed.';
      document.getElementById('ep-error').style.display='block';
      await signOut(auth); return;
    }
    _uid=user.uid;
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    document.getElementById('auth-overlay').style.display='none';
    document.getElementById('loading-overlay').style.display='flex';
    await loadCompleted();
    document.getElementById('loading-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  } else {
    _uid=null;
    document.getElementById('app').style.display='none';
    document.getElementById('auth-overlay').style.display='flex';
  }
});

window.sfEmailSignIn = function() {
  const email=(document.getElementById('ep-email').value||'').trim().toLowerCase();
  const pwd=document.getElementById('ep-password').value||'';
  const errEl=document.getElementById('ep-error');
  errEl.style.display='none';
  if(!email||!pwd){errEl.textContent='Please enter your email and password.';errEl.style.display='block';return;}
  if(!email.endsWith('@sourcefuse.com')){errEl.textContent='Only @sourcefuse.com accounts are allowed.';errEl.style.display='block';return;}
  signInWithEmailAndPassword(auth,email,pwd).catch(e=>{
    errEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'Incorrect password.'
      :(e.code==='auth/user-not-found')?'No account found for this email.':e.message;
    errEl.style.display='block';
  });
};

async function loadCompleted(){const snap=await getDoc(doc(db,'progress',_uid));_completed=snap.exists()?(snap.data()[MODULE_KEY]||[]):[];}
async function markComplete(id){
  if(!_uid||_completed.includes(id))return;
  _completed=[..._completed,id];
  const ref=doc(db,'progress',_uid);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{[MODULE_KEY]:_completed,updatedAt:serverTimestamp()});}
  else{await updateDoc(ref,{[MODULE_KEY]:arrayUnion(id),updatedAt:serverTimestamp()});}
  updateSectionUI(id);updateSidebarProgress();
}
function renderAll(){renderSections();renderNavItems();updateSidebarProgress();}
function renderSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const bh=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="section-block" id="block-${s.id}">
      <div class="section-header" onclick="toggleSection(${s.id})">
        <span class="section-num">${MODULE_NUM}.${s.id}</span>
        <span class="section-title">${s.title}</span>
        ${bh}${done?'<span style="color:#43A047;font-size:.85rem;">✓</span>':''}
        <span class="section-toggle" id="toggle-${s.id}">▼</span>
      </div>
      <div class="section-body" id="body-${s.id}">
        ${s.content}
        <button class="complete-btn ${done?'done':''}" id="complete-btn-${s.id}" onclick="handleMarkComplete(${s.id})" ${done?'disabled':''}>
          ${done?'✅ Completed':'✔ Mark as Completed'}
        </button>
        <span class="save-indicator" id="indicator-${s.id}"></span>
      </div>
    </div>`;
  }).join('');
  const fi=SECTIONS.find(s=>!_completed.includes(s.id));
  if(fi)toggleSection(fi.id);else if(SECTIONS.length>0)toggleSection(SECTIONS[0].id);
}
function renderNavItems(){
  const nav=document.getElementById('nav-items');
  nav.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const b=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="nav-item ${done?'completed':''}" id="nav-${s.id}" onclick="scrollToSection(${s.id})"><span>${MODULE_NUM}.${s.id} ${s.title}</span>${b}</div>`;
  }).join('');
}
function updateSidebarProgress(){const done=_completed.length;const pct=Math.round((done/SECTIONS.length)*100);document.getElementById('sidebar-bar').style.width=pct+'%';document.getElementById('sidebar-pct').textContent=pct+'%';}
function updateSectionUI(id){
  const btn=document.getElementById(`complete-btn-${id}`);const nav=document.getElementById(`nav-${id}`);const blk=document.getElementById(`block-${id}`);
  if(btn){btn.classList.add('done');btn.disabled=true;btn.textContent='✅ Completed';}
  if(nav)nav.classList.add('completed');
  const hdr=blk?.querySelector('.section-header');
  if(hdr&&!hdr.querySelector('.done-tick')){const tick=document.createElement('span');tick.className='done-tick';tick.style.cssText='color:#43A047;font-size:.85rem;';tick.textContent='✓';hdr.insertBefore(tick,hdr.querySelector('.section-toggle'));}
}
window.handleMarkComplete=async function(id){const btn=document.getElementById(`complete-btn-${id}`);if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Saving…';const ind=document.getElementById(`indicator-${id}`);if(ind)ind.textContent='Saving…';await markComplete(id);if(ind){ind.textContent='Saved ✓';setTimeout(()=>ind.textContent='',2000);}};
window.toggleSection=function(id){SECTIONS.forEach(s=>{const body=document.getElementById(`body-${s.id}`);const toggle=document.getElementById(`toggle-${s.id}`);const nav=document.getElementById(`nav-${s.id}`);if(s.id===id){const isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);toggle?.classList.toggle('open',!isOpen);nav?.classList.toggle('active',!isOpen);}else{body.classList.remove('open');toggle?.classList.remove('open');nav?.classList.remove('active');}});};
window.scrollToSection=function(id){toggleSection(id);document.getElementById(`block-${id}`)?.scrollIntoView({behavior:'smooth',block:'start'})};
window.markComplete=markComplete;
</script>
</body>
</html>
