  {
    id: 1,
    title: 'Core Chart Types & When to Use Them',
    badge: '',
    content: `
<p>Power BI offers 30+ native visual types. Knowing <em>when</em> to use each one — not just <em>how</em> — is the mark of an effective report author.</p>
<h3>Comparison Visuals</h3>
<ul>
  <li><strong>Clustered Bar / Column Chart</strong> — compare values across discrete categories. Bar = horizontal (better for long category names). Column = vertical (better for time periods). Best for ≤ 10 categories.</li>
  <li><strong>Stacked Bar / Column Chart</strong> — compare totals AND composition simultaneously. Useful when the part-to-whole relationship matters (revenue breakdown by product within each region).</li>
</ul>
<h3>Trend Visuals</h3>
<ul>
  <li><strong>Line Chart</strong> — show trends over continuous time or ordered categories. Use for time-series data. Never use a bar chart for continuous trend data.</li>
  <li><strong>Area Chart</strong> — like a line chart but fills the area below the line. Good for cumulative totals or emphasising volume over time.</li>
</ul>
<h3>Part-to-Whole Visuals</h3>
<ul>
  <li><strong>Pie / Donut Chart</strong> — show proportions of a whole. Limit to ≤ 5 slices. Never use when exact values matter — humans struggle to compare slice angles accurately.</li>
  <li><strong>Treemap</strong> — hierarchical proportional area chart. Good for 2-level breakdowns (category → subcategory by revenue).</li>
</ul>
<h3>Relationship & Distribution Visuals</h3>
<ul>
  <li><strong>Scatter Chart</strong> — plot two measures against each other to reveal correlations. Add a third measure as bubble size for a three-dimensional view. Requires Detail field to plot individual marks.</li>
  <li><strong>Matrix</strong> — cross-tabulation (pivot table). Supports drill-down hierarchies in rows and columns. Best for showing two-dimensional breakdowns (region × product × time).</li>
</ul>
<h3>KPI and Summary Visuals</h3>
<ul>
  <li><strong>Card</strong> — display a single number prominently (Total Revenue, Order Count). Use for dashboard headlines.</li>
  <li><strong>KPI</strong> — show a measure against a target with trend indicator. Requires a Value measure, a Target measure, and a date/time axis for trend direction.</li>
  <li><strong>Gauge</strong> — shows a single value in context of minimum and maximum. Use for capacity, quota attainment, completion percentage.</li>
</ul>
<div class="callout callout-warn"><strong>Map visuals (Filled Map, Map, Azure Maps):</strong> Require geographic fields (country, state, city, latitude/longitude). Enable under File → Options → Security → Map and filled map visuals. Never use a bar chart to display geographically distributed data that has a spatial pattern.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>You need to show revenue trends over 24 months. Which chart type is most appropriate?</li><li>When should you prefer a Matrix visual over a Table visual?</li><li>What three fields does the KPI visual require?</li></ul></div>`

    title: 'Slicers, Filters & Cross-Filter Behavior',
    badge: '',
    content: `
<p>Power BI has multiple layers of filtering. Understanding each layer — and how they interact — is critical for building predictable, accurate reports.</p>
<h3>The Four Filter Layers</h3>
<ol>
  <li><strong>Visual-level filters</strong> — applied to a single visual. Click the visual → expand Filters pane → drag a field to "Filters on this visual". Only that visual is affected.</li>
  <li><strong>Page-level filters</strong> — applied to all visuals on the current report page. Drag a field to "Filters on this page".</li>
  <li><strong>Report-level filters</strong> — applied to all pages in the report. Drag a field to "Filters on all pages".</li>
  <li><strong>Drillthrough filters</strong> — passed automatically when a user right-clicks a data point and selects "Drill through" to a detail page.</li>
</ol>
<h3>Slicers</h3>
<p>A slicer is an interactive filter control on the report canvas. Drag any field into a slicer visual — users click to filter. Slicer types:</p>
<ul>
  <li><strong>List</strong> — checkboxes or single-select list of all values.</li>
  <li><strong>Dropdown</strong> — compact dropdown menu. Best for slicers with many values.</li>
  <li><strong>Between / Before / After</strong> — date or number range slider.</li>
  <li><strong>Relative Date / Time</strong> — "Last 7 days", "This month", "This quarter" — automatically updates relative to today.</li>
</ul>
<h3>Cross-Filter Behavior</h3>
<p>By default, clicking a bar in one visual filters all other visuals on the page. This is <strong>cross-filtering</strong>. To change it: Format tab → Edit Interactions. Select the source visual — then for each target visual choose:</p>
<ul>
  <li><strong>Filter</strong> (funnel icon) — target is filtered to show only related data.</li>
  <li><strong>Highlight</strong> (bar chart icon) — target dims non-matching bars but keeps them visible.</li>
  <li><strong>None</strong> (circle-slash) — target is completely unaffected by the source selection.</li>
</ul>
<div class="callout callout-info"><strong>Slicer vs. Filter pane:</strong> Slicers are visible on the canvas — users can see and change them. Filter pane filters are less discoverable and can be locked from end-user modification (report designers can lock individual filters). Use slicers for primary user interactions, filter pane for structural constraints.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>A filter applied in the Filters pane at "page" level affects which visuals?</li><li>What is the difference between cross-filter "Filter" and cross-filter "Highlight" modes?</li><li>Which slicer type is most appropriate for filtering by "the last 30 days" relative to today?</li></ul></div>`
  },

    title: 'Drill-Through, Drill-Down & Tooltips',
    badge: '',
    content: `
<p>Drill interactions allow report users to explore data at increasing levels of detail — moving from summary to detail without creating separate reports.</p>
<h3>Drill-Down (within a visual)</h3>
<p>Drill-down operates within a single visual that has a <strong>field hierarchy</strong> in its axis or rows/columns. Example: Year → Quarter → Month → Day as a hierarchy in a line chart X-axis.</p>
<ul>
  <li>Click the <strong>double-arrow down icon</strong> (go to next level) — expands all items to the next hierarchy level simultaneously.</li>
  <li>Click the <strong>single-arrow down icon</strong> — click a specific bar/point to drill into just that member's children.</li>
  <li>Click the <strong>up arrow</strong> — drill back up one level.</li>
</ul>
<p>Add hierarchy levels to a visual by dragging multiple fields into the same Axis/Rows/Columns well one at a time.</p>
<h3>Drill-Through (across pages)</h3>
<p>Drill-through navigates from a summary visual to a detail page filtered by the selected data point.</p>
<ol>
  <li>Create a new report page — this will be the detail page.</li>
  <li>On the detail page, drag the field you want to filter by (e.g. customer_name) to the <strong>Drillthrough</strong> well in the Visualizations pane.</li>
  <li>Back on any summary page, right-click any data point → Drill through → [detail page name]. The detail page opens filtered to the selected customer.</li>
</ol>
<p>Power BI automatically adds a back-arrow button on the drillthrough page for navigation.</p>
<h3>Custom Tooltip Pages</h3>
<p>A tooltip page is a hidden report page that appears when a user hovers over a data point — showing a rich mini-dashboard instead of the default tooltip text.</p>
<ol>

<p>Bookmarks capture a snapshot of a report's current state — visual selections, filter states, and visible/hidden layers. Combined with buttons, they power professional in-report navigation and storytelling.</p>
<h3>What a Bookmark Captures</h3>
<p>By default, a bookmark captures: the current filter and slicer state, which visuals are visible or hidden (via the Selection pane), and the current drill state of visuals. You can configure exactly what each bookmark captures via the Bookmarks pane → three-dot menu on a bookmark → Update / Rename / Delete.</p>
<h3>Creating Bookmarks</h3>
<ol>
  <li>Set the report to the exact state you want to capture (apply filters, show/hide visuals).</li>
  <li>View menu → Bookmarks pane → <strong>Add</strong>. A new bookmark appears — rename it descriptively ("Revenue by Region — North filtered").</li>
  <li>To update a bookmark with a new state: configure the report → three-dot menu on the bookmark → Update.</li>
</ol>
<h3>Using Bookmarks for Navigation</h3>
<p>Insert a <strong>Button</strong> (Insert → Buttons) or a <strong>Shape</strong>. In the Format pane → Action → enable Action → Type: Bookmark → select the bookmark. Users click the button to jump to that state. This creates tab-like navigation without page changes — ideal for switching between KPI views.</p>
<h3>The Selection Pane + Bookmarks Combination</h3>
<p>The <strong>Selection pane</strong> (View → Selection) shows all visual objects on the page with visibility (eye icon) and tab order. Show or hide objects by clicking the eye. Save that state as a bookmark. Now you can toggle between "showing Chart A" and "showing Chart B" bookmarks — creating swappable visuals at the same position on the canvas.</p>
<h3>Bookmark Navigator Visual</h3>
<p>Power BI's built-in <strong>Bookmark Navigator</strong> (Insert → Buttons → Navigator → Bookmark Navigator) automatically generates a button group from all bookmarks — no manual button configuration needed. Format it to match your report theme.</p>
<div class="callout callout-info"><strong>Common pattern:</strong> Create a "Reset Filters" bookmark with all slicers cleared. Assign it to a reset button so users can return to the default state with one click.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What does a Power BI bookmark capture by default?</li><li>How would you create a button that toggles between two different visuals at the same canvas position?</li><li>What is the Bookmark Navigator and what does it automate?</li></ul></div>`

<p>The best-designed reports communicate one clear message per page, guide the viewer's eye intuitively, and respond correctly to every user interaction. These principles separate functional dashboards from excellent ones.</p>
<h3>One Message Per Page</h3>
<p>Each report page should answer one business question: "How are we performing against revenue targets this month?" or "Which product categories drive the most profit?" Mixing multiple unrelated questions on one page creates cognitive overload. Use additional pages for secondary analyses.</p>
<h3>Visual Hierarchy and Layout</h3>
<ul>
  <li><strong>Place KPI cards at the top.</strong> Users scan top-left first (F-pattern reading). Headline numbers (Total Revenue, Order Count, Profit Margin) should be the first thing they see.</li>
  <li><strong>Primary chart below/right of KPIs.</strong> The main analysis visual gets the most canvas space.</li>
  <li><strong>Slicers on the left or top.</strong> Consistent placement prevents users from hunting for filters.</li>
  <li><strong>Align and distribute.</strong> Use View → Snap to Grid. Misaligned visuals look unprofessional and distract from the data.</li>
</ul>
<h3>Themes</h3>
<p>Apply a consistent report theme: View → Themes. Built-in themes provide colour palettes. Custom themes (JSON files) give full control over all visual formatting properties — fonts, colours, padding, border settings. Distribute a theme JSON to ensure all reports in the organisation look consistent.</p>
<h3>Mobile Layout</h3>
<p>View → Mobile Layout allows you to arrange visuals for phone-sized screens. The desktop and mobile layouts are independent — you can choose which visuals to include and reorder them for vertical scrolling. Published to the Power BI Service, the mobile layout shows automatically in the Power BI mobile app.</p>
<h3>Accessibility</h3>
<ul>
  <li>Every visual should have an <strong>Alt text</strong> (Format → General → Alt text) describing its content for screen reader users.</li>
  <li>Use colour-blind-safe palettes. Avoid red/green combinations.</li>
  <li>Ensure tab order in the Selection pane follows a logical reading sequence.</li>
  <li>Add data labels where numeric precision matters — do not force users to estimate values from bar heights.</li>
</ul>
<div class="callout callout-warn"><strong>Performance:</strong> Each visual on a page generates one or more DAX queries. Pages with 15+ visuals can become slow. Use Performance Analyzer (View → Performance Analyzer) to measure each visual's query time and identify slow measures.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What tool in Power BI Desktop helps you identify which visuals are causing slow page load times?</li><li>What is the purpose of the Mobile Layout view in Power BI Desktop?</li><li>Why should slicers be placed consistently (left or top) on every report page?</li></ul></div>`

let _uid = null, _completed = [];

document.getElementById('signin-btn').addEventListener('click', () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
    document.getElementById('ep-error').textContent = e.message||'Sign-in failed.';
    document.getElementById('ep-error').style.display='block';
  });
});
document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!user.email||!user.email.endsWith('@sourcefuse.com')) {
      document.getElementById('ep-error').textContent='Only @sourcefuse.com accounts are allowed.';
      document.getElementById('ep-error').style.display='block';
      await signOut(auth); return;
    }
    _uid=user.uid;
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    document.getElementById('auth-overlay').style.display='none';
    document.getElementById('loading-overlay').style.display='flex';
    await loadCompleted();
    document.getElementById('loading-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  } else {
    _uid=null;
    document.getElementById('app').style.display='none';
    document.getElementById('auth-overlay').style.display='flex';
  }
});

window.sfEmailSignIn = function() {
  const email=(document.getElementById('ep-email').value||'').trim().toLowerCase();
  const pwd=document.getElementById('ep-password').value||'';
  const errEl=document.getElementById('ep-error');
  errEl.style.display='none';
  if(!email||!pwd){errEl.textContent='Please enter your email and password.';errEl.style.display='block';return;}
  if(!email.endsWith('@sourcefuse.com')){errEl.textContent='Only @sourcefuse.com accounts are allowed.';errEl.style.display='block';return;}
  signInWithEmailAndPassword(auth,email,pwd).catch(e=>{
    errEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'Incorrect password.'
      :(e.code==='auth/user-not-found')?'No account found for this email.':e.message;
    errEl.style.display='block';
  });
};

async function loadCompleted(){const snap=await getDoc(doc(db,'progress',_uid));_completed=snap.exists()?(snap.data()[MODULE_KEY]||[]):[];}
async function markComplete(id){
  if(!_uid||_completed.includes(id))return;
  _completed=[..._completed,id];
  const ref=doc(db,'progress',_uid);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{[MODULE_KEY]:_completed,updatedAt:serverTimestamp()});}
  else{await updateDoc(ref,{[MODULE_KEY]:arrayUnion(id),updatedAt:serverTimestamp()});}
  updateSectionUI(id);updateSidebarProgress();
}
function renderAll(){renderSections();renderNavItems();updateSidebarProgress();}
function renderSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const bh=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="section-block" id="block-${s.id}">
      <div class="section-header" onclick="toggleSection(${s.id})">
        <span class="section-num">${MODULE_NUM}.${s.id}</span>
        <span class="section-title">${s.title}</span>
        ${bh}${done?'<span style="color:#43A047;font-size:.85rem;">✓</span>':''}
        <span class="section-toggle" id="toggle-${s.id}">▼</span>
      </div>
      <div class="section-body" id="body-${s.id}">
        ${s.content}
        <button class="complete-btn ${done?'done':''}" id="complete-btn-${s.id}" onclick="handleMarkComplete(${s.id})" ${done?'disabled':''}>
          ${done?'✅ Completed':'✔ Mark as Completed'}
        </button>
        <span class="save-indicator" id="indicator-${s.id}"></span>
      </div>
    </div>`;
  }).join('');
  const fi=SECTIONS.find(s=>!_completed.includes(s.id));
  if(fi)toggleSection(fi.id);else if(SECTIONS.length>0)toggleSection(SECTIONS[0].id);
}
function renderNavItems(){
  const nav=document.getElementById('nav-items');
  nav.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const b=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="nav-item ${done?'completed':''}" id="nav-${s.id}" onclick="scrollToSection(${s.id})"><span>${MODULE_NUM}.${s.id} ${s.title}</span>${b}</div>`;
  }).join('');
}
function updateSidebarProgress(){const done=_completed.length;const pct=Math.round((done/SECTIONS.length)*100);document.getElementById('sidebar-bar').style.width=pct+'%';document.getElementById('sidebar-pct').textContent=pct+'%';}
function updateSectionUI(id){
  const btn=document.getElementById(`complete-btn-${id}`);const nav=document.getElementById(`nav-${id}`);const blk=document.getElementById(`block-${id}`);
  if(btn){btn.classList.add('done');btn.disabled=true;btn.textContent='✅ Completed';}
  if(nav)nav.classList.add('completed');
  const hdr=blk?.querySelector('.section-header');
  if(hdr&&!hdr.querySelector('.done-tick')){const tick=document.createElement('span');tick.className='done-tick';tick.style.cssText='color:#43A047;font-size:.85rem;';tick.textContent='✓';hdr.insertBefore(tick,hdr.querySelector('.section-toggle'));}
}
window.handleMarkComplete=async function(id){const btn=document.getElementById(`complete-btn-${id}`);if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Saving…';const ind=document.getElementById(`indicator-${id}`);if(ind)ind.textContent='Saving…';await markComplete(id);if(ind){ind.textContent='Saved ✓';setTimeout(()=>ind.textContent='',2000);}};
window.toggleSection=function(id){SECTIONS.forEach(s=>{const body=document.getElementById(`body-${s.id}`);const toggle=document.getElementById(`toggle-${s.id}`);const nav=document.getElementById(`nav-${s.id}`);if(s.id===id){const isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);toggle?.classList.toggle('open',!isOpen);nav?.classList.toggle('active',!isOpen);}else{body.classList.remove('open');toggle?.classList.remove('open');nav?.classList.remove('active');}});};
window.scrollToSection=function(id){toggleSection(id);document.getElementById(`block-${id}`)?.scrollIntoView({behavior:'smooth',block:'start'})};
window.markComplete=markComplete;
</script>
