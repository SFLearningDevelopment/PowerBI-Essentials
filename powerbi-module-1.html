    title: 'The Power BI Ecosystem',
    badge: '',
    content: `
<p>Power BI is Microsoft's cloud-connected analytics platform — a suite of tools that takes data from raw sources to interactive reports and governed dashboards. Understanding where each tool fits prevents confusion and wasted effort.</p>
<h3>The Core Products</h3>
<ul>
  <li><strong>Power BI Desktop</strong> — the free Windows authoring tool. You connect, transform data in Power Query, model relationships, write DAX measures, and design report pages here. Think of it as your studio.</li>
  <li><strong>Power BI Service</strong> (app.powerbi.com) — the cloud portal where you publish, share, schedule refreshes, and govern content. Think of it as the gallery where your audience views work.</li>
  <li><strong>Power BI Mobile</strong> — iOS and Android apps for consuming reports on the go. Reports adapt to mobile layout if the author enables it.</li>
  <li><strong>Power BI Report Server</strong> — the on-premises option for organisations that cannot use the cloud.</li>
  <li><strong>Power BI Embedded</strong> — APIs for embedding Power BI visuals inside custom applications.</li>
</ul>
<h3>The Typical Authoring Workflow</h3>
<p>Most SourceFuse projects follow: <strong>Desktop (Build) → Publish → Service (Share) → App (Distribute)</strong>. You build everything in Desktop — Power Query cleans the data, the Model view defines relationships, Report pages display visuals — then publish to the Service for scheduling and distribution.</p>
<h3>Licensing at a Glance</h3>
<ul>
  <li><strong>Free</strong> — Desktop only; you cannot share content to others.</li>
  <li><strong>Pro</strong> — publish to workspaces, share with other Pro users. This is the standard SourceFuse licence for report authors.</li>

</ul>
<div class="callout callout-info"><strong>SourceFuse context:</strong> Most internal BI work uses Power BI Pro licences. Content is shared to colleagues via shared workspaces or packaged Apps.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>Which Power BI component is used for authoring reports before publishing?</li><li>What is the key difference between Power BI Service and Power BI Desktop?</li><li>Which licence tier is required to share content with other Power BI Pro users?</li></ul></div>`

<p>Power BI Desktop has three main views, each serving a distinct purpose. Knowing when to use each prevents authors from trying to do the wrong thing in the wrong place.</p>
<h3>The Three Views</h3>
<ul>
  <li><strong>Report View</strong> — the visual canvas where you place and configure visualisations, slicers, text boxes, images, and shapes. This is what end users see when they open a published report.</li>
  <li><strong>Data View</strong> — a spreadsheet-like grid showing each table's rows. Use it to browse data, inspect data types, and write calculated columns (the results appear as new columns in the grid immediately).</li>
  <li><strong>Model View</strong> — a diagram showing all tables and their relationships. Create, edit, and audit your data model structure here.</li>
</ul>
<h3>The Key Panes</h3>
<ul>
  <li><strong>Fields Pane</strong> — lists all tables, columns, and measures. Drag fields from here into visual wells or onto the canvas.</li>
  <li><strong>Visualisations Pane</strong> — choose a chart type (bar, line, map, etc.) and configure its field wells (Axis, Values, Legend) and format settings.</li>
  <li><strong>Filters Pane</strong> — apply visual-level, page-level, or report-level filters without occupying canvas space.</li>
  <li><strong>Format Pane</strong> (brush icon in the Visualisations pane) — controls all visual appearance: colours, fonts, axis labels, borders, and padding.</li>
</ul>
<div class="callout callout-tip"><strong>Tip:</strong> You can hide the Fields and Visualisations panes using the View ribbon to maximise canvas space during design. Use <span class="inline-code">View → Page View → Fit to Page</span> to see your full report at once.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>In which Power BI Desktop view do you create and manage table relationships?</li><li>In which view can you write a calculated column and immediately see its values?</li><li>What is the purpose of the Filters Pane?</li></ul></div>`

<p>Power BI's <strong>Get Data</strong> dialog (Home ribbon → Get Data) provides over 100 connectors. Choosing the right connector and connection mode profoundly affects performance and data freshness.</p>
<h3>Common Connectors</h3>
<ul>
  <li><strong>Text/CSV</strong> — flat files. Simple, reliable, perfect for course labs using <span class="inline-code">sf-sales-orders.csv</span>.</li>
  <li><strong>Excel Workbook</strong> — connects to named tables or sheets inside Excel files.</li>
  <li><strong>SQL Server / Azure SQL</strong> — relational databases; supports query folding (Power Query pushes transformation logic to the database).</li>
  <li><strong>SharePoint Online List</strong> — SharePoint lists, useful for reference data maintained by business users.</li>
  <li><strong>Web</strong> — HTML tables from a URL; entry point for REST API data via M language.</li>
</ul>
<h3>Connection Modes</h3>
<ul>
  <li><strong>Import</strong> — data is copied into Power BI's Vertipaq in-memory engine. Fastest query performance. Requires scheduled refresh to stay current. Limited by model size (1 GB on Pro, higher on Premium).</li>
  <li><strong>DirectQuery</strong> — every visual interaction sends a live query to the source database. Always current but performance depends entirely on the source. Limited DAX support.</li>
  <li><strong>Live Connection</strong> — connects to a published Power BI dataset or Azure Analysis Services. The report has no local model; all calculations are delegated to the remote engine.</li>
</ul>
<div class="callout callout-warn"><strong>Decision rule:</strong> Default to <strong>Import</strong> for internal reporting. Use DirectQuery only when data must be real-time and the source can handle the query load.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>In Import mode, when is the data in the model updated from the source?</li><li>What is the key advantage of DirectQuery over Import mode?</li><li>Which mode sends a query to the source on every visual interaction?</li></ul></div>`

<p>Each Power BI Desktop view exposes different capabilities. Understanding which tasks belong in which view is a foundational skill.</p>
<h3>Report View — The Canvas</h3>
<p>Report View is where you build the end-user experience. Each report can have multiple pages (tabs at the bottom). You insert visuals by selecting a chart type in the Visualisations pane, then dragging fields into the visual wells. The Format pane controls all appearance properties.</p>
<p>Key Report View capabilities: add/resize/format visuals, configure cross-filter interactions between visuals, insert bookmarks, create drill-through pages, apply report themes, and preview mobile layout.</p>
<h3>Data View — Browse and Calculate</h3>
<p>Data View shows the raw rows of each table in a grid. Use it to verify data loaded correctly, inspect row counts and data types, and write <strong>calculated columns</strong> (DAX formulas that produce a new column stored in the model). The results appear immediately in the grid row by row.</p>
<div class="callout callout-info"><strong>Important:</strong> You cannot add, edit, or delete rows of data in Data View. Power BI is read-only from a data perspective — all data changes happen in the source system or in Power Query.</div>
<h3>Model View — Your Data Architecture</h3>
<p>Model View displays all tables as boxes and all relationships as connector lines. Here you: create relationships by dragging a column onto another table's column, edit relationship cardinality and cross-filter direction, set a table as the Date Table, and hide columns from the report view to keep the Fields pane clean.</p>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>In which view would you create a relationship between two tables?</li><li>In which view can you see the result of a calculated column row by row?</li><li>Can you modify data rows in Power BI Desktop's Data View?</li></ul></div>`
  },

    title: 'Publishing to Power BI Service',
    badge: '',
    content: `
<p>Publishing bridges Desktop (authoring) and Service (sharing). Understanding what gets published, where it goes, and how to update it are essential day-one operational skills.</p>
<h3>The Publish Flow</h3>
<ol>
  <li>In Desktop, click <strong>Home → Publish</strong>.</li>
  <li>Sign in with your Microsoft 365 account if prompted.</li>
  <li>Select a <strong>destination workspace</strong> — My Workspace, or a shared workspace you have access to.</li>
  <li>If a report with the same name already exists, Power BI asks to replace it. Confirm to overwrite.</li>
  <li>A success notification appears with a link to open the report in the Service.</li>
</ol>
<h3>What Gets Published</h3>
<p>Publishing always creates two artefacts in the Service: the <strong>dataset</strong> (the data model — all tables, relationships, DAX measures, and Import data) and the <strong>report</strong> (the page layouts and visual configurations). These are separate objects. You can build multiple reports on top of one published dataset without duplicating data.</p>
<h3>Scheduled Refresh</h3>
<p>Import datasets go stale after publishing. Configure scheduled refresh in the Service: open the dataset → Settings → Scheduled Refresh. Power BI connects to the source via an <strong>On-Premises Data Gateway</strong> if the source is local (CSV, SQL Server on-prem), or directly if the source is cloud-hosted (Azure SQL, SharePoint Online).</p>
<div class="callout callout-warn"><strong>Local CSV caveat:</strong> Power BI cannot refresh local CSV files from the Service without a gateway. For production use, move files to SharePoint or OneDrive for gateway-free refresh.</div>

let _uid = null, _completed = [];

document.getElementById('signin-btn').addEventListener('click', () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
    document.getElementById('ep-error').textContent = e.message||'Sign-in failed.';
    document.getElementById('ep-error').style.display='block';
  });
});
document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!user.email||!user.email.endsWith('@sourcefuse.com')) {
      document.getElementById('ep-error').textContent='Only @sourcefuse.com accounts are allowed.';
      document.getElementById('ep-error').style.display='block';
      await signOut(auth); return;
    }
    _uid=user.uid;
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    document.getElementById('auth-overlay').style.display='none';
    document.getElementById('loading-overlay').style.display='flex';
    await loadCompleted();
    document.getElementById('loading-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  } else {
    _uid=null;
    document.getElementById('app').style.display='none';
    document.getElementById('auth-overlay').style.display='flex';
  }
});

window.sfEmailSignIn = function() {
  const email=(document.getElementById('ep-email').value||'').trim().toLowerCase();
  const pwd=document.getElementById('ep-password').value||'';
  const errEl=document.getElementById('ep-error');
  errEl.style.display='none';
  if(!email||!pwd){errEl.textContent='Please enter your email and password.';errEl.style.display='block';return;}
  if(!email.endsWith('@sourcefuse.com')){errEl.textContent='Only @sourcefuse.com accounts are allowed.';errEl.style.display='block';return;}
  signInWithEmailAndPassword(auth,email,pwd).catch(e=>{
    errEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'Incorrect password.'
      :(e.code==='auth/user-not-found')?'No account found for this email.':e.message;
    errEl.style.display='block';
  });
};

async function loadCompleted(){const snap=await getDoc(doc(db,'progress',_uid));_completed=snap.exists()?(snap.data()[MODULE_KEY]||[]):[];}
async function markComplete(id){
  if(!_uid||_completed.includes(id))return;
  _completed=[..._completed,id];
  const ref=doc(db,'progress',_uid);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{[MODULE_KEY]:_completed,updatedAt:serverTimestamp()});}
  else{await updateDoc(ref,{[MODULE_KEY]:arrayUnion(id),updatedAt:serverTimestamp()});}
  updateSectionUI(id);updateSidebarProgress();
}
function renderAll(){renderSections();renderNavItems();updateSidebarProgress();}
function renderSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const bh=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="section-block" id="block-${s.id}">
      <div class="section-header" onclick="toggleSection(${s.id})">
        <span class="section-num">${MODULE_NUM}.${s.id}</span>
        <span class="section-title">${s.title}</span>
        ${bh}${done?'<span style="color:#43A047;font-size:.85rem;">✓</span>':''}
        <span class="section-toggle" id="toggle-${s.id}">▼</span>
      </div>
      <div class="section-body" id="body-${s.id}">
        ${s.content}
        <button class="complete-btn ${done?'done':''}" id="complete-btn-${s.id}" onclick="handleMarkComplete(${s.id})" ${done?'disabled':''}>
          ${done?'✅ Completed':'✔ Mark as Completed'}
        </button>
        <span class="save-indicator" id="indicator-${s.id}"></span>
      </div>
    </div>`;
  }).join('');
  const fi=SECTIONS.find(s=>!_completed.includes(s.id));
  if(fi)toggleSection(fi.id);else if(SECTIONS.length>0)toggleSection(SECTIONS[0].id);
}
function renderNavItems(){
  const nav=document.getElementById('nav-items');
  nav.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const b=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="nav-item ${done?'completed':''}" id="nav-${s.id}" onclick="scrollToSection(${s.id})"><span>${MODULE_NUM}.${s.id} ${s.title}</span>${b}</div>`;
  }).join('');
}
function updateSidebarProgress(){const done=_completed.length;const pct=Math.round((done/SECTIONS.length)*100);document.getElementById('sidebar-bar').style.width=pct+'%';document.getElementById('sidebar-pct').textContent=pct+'%';}
function updateSectionUI(id){
  const btn=document.getElementById(`complete-btn-${id}`);const nav=document.getElementById(`nav-${id}`);const blk=document.getElementById(`block-${id}`);
  if(btn){btn.classList.add('done');btn.disabled=true;btn.textContent='✅ Completed';}
  if(nav)nav.classList.add('completed');
  const hdr=blk?.querySelector('.section-header');
  if(hdr&&!hdr.querySelector('.done-tick')){const tick=document.createElement('span');tick.className='done-tick';tick.style.cssText='color:#43A047;font-size:.85rem;';tick.textContent='✓';hdr.insertBefore(tick,hdr.querySelector('.section-toggle'));}
}
window.handleMarkComplete=async function(id){const btn=document.getElementById(`complete-btn-${id}`);if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Saving…';const ind=document.getElementById(`indicator-${id}`);if(ind)ind.textContent='Saving…';await markComplete(id);if(ind){ind.textContent='Saved ✓';setTimeout(()=>ind.textContent='',2000);}};
window.toggleSection=function(id){SECTIONS.forEach(s=>{const body=document.getElementById(`body-${s.id}`);const toggle=document.getElementById(`toggle-${s.id}`);const nav=document.getElementById(`nav-${s.id}`);if(s.id===id){const isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);toggle?.classList.toggle('open',!isOpen);nav?.classList.toggle('active',!isOpen);}else{body.classList.remove('open');toggle?.classList.remove('open');nav?.classList.remove('active');}});};
window.scrollToSection=function(id){toggleSection(id);document.getElementById(`block-${id}`)?.scrollIntoView({behavior:'smooth',block:'start'})};
window.markComplete=markComplete;
</script>
</body>
