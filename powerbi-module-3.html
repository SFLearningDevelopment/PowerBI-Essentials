    title: 'Why Data Modeling Matters in Power BI',
    badge: '',
    content: `
<p>Before writing a single DAX measure or building a single visual, understanding <strong>why Power BI models data</strong> is essential. A well-designed model is the difference between a fast, accurate report and a slow, confusing one.</p>
<h3>The Vertipaq Engine</h3>
<p>Power BI's in-memory engine is called <strong>Vertipaq</strong> (also called the xVelocity engine). It uses <strong>columnar, compressed storage</strong> — instead of storing rows together like a spreadsheet, it stores each column independently and compresses repeating values aggressively. A column containing "North", "South", "East", "West" repeated across a million rows might compress to just 4 unique values plus a bitmap index — consuming a tiny fraction of the memory a row-store would need.</p>
<p>The consequence: Vertipaq is extremely fast at <em>aggregating columns</em> (SUM, COUNT, AVERAGE) because it processes only the relevant column, not full rows. This is the reason why Power BI reports load in seconds even on millions of rows.</p>
<h3>Flat Tables vs. Star Schemas</h3>
<p>A <strong>flat table</strong> is a single denormalized table with every attribute and every measure in one place — like a typical spreadsheet export with order_id, customer_name, customer_email, customer_region, product_name, product_category, revenue, profit all in one row.</p>
<p>The problems with flat tables in Power BI:</p>
<ul>
  <li><strong>Repeated text degrades compression.</strong> "Electronics" repeated 50,000 times in a flat table compresses less efficiently than it would in a separate dim_category table with one row per category.</li>
  <li><strong>Ambiguous relationships.</strong> If you join two flat tables on a shared key, Power BI may not know which direction to filter — causing incorrect aggregations.</li>
  <li><strong>DAX becomes brittle.</strong> Many DAX functions (especially RELATED and USERELATIONSHIP) require a proper relational model to work correctly.</li>
</ul>
<div class="callout callout-info"><strong>Key insight:</strong> Even if you connect one flat table, it works. But for multi-table models with accurate cross-filtering and reliable DAX, a <strong>star schema</strong> is the correct foundation.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What storage model does Power BI's Vertipaq engine use?</li><li>Why does columnar storage benefit analytical (aggregate) queries?</li><li>Name two disadvantages of using a flat denormalized table in a multi-table Power BI model.</li></ul></div>`

    title: 'Star Schema Design Principles',
    badge: '',
    content: `
<p>A <strong>star schema</strong> places one or more <strong>fact tables</strong> at the center, surrounded by <strong>dimension tables</strong> that connect to the fact table via foreign keys. Viewed in Model View, the diagram looks like a star — hence the name.</p>
<h3>Core Principles</h3>
<ul>
  <li><strong>One grain per fact table.</strong> Every row in a fact table must represent the same thing — one order line, one daily snapshot, one transaction. Mixing grains (some rows = orders, some rows = returns) breaks aggregations.</li>
  <li><strong>Dimensions are wide and flat.</strong> A good dimension table has many descriptive attributes (customer_name, customer_email, customer_region, customer_segment) and a low row count relative to the fact table.</li>
  <li><strong>Facts are narrow and tall.</strong> A fact table has foreign keys (linking to dimensions) and numeric measures (revenue, quantity, profit). It should have as few text columns as possible.</li>
  <li><strong>Integer surrogate keys.</strong> Relationships should use integer IDs (customer_id: 1, 2, 3...) not text strings ("CUST-NORTHWEST-ENTERPRISE-1234"). Integer keys compress better and join faster in Vertipaq.</li>
</ul>
<h3>Why One-to-Many (1:M) Relationships</h3>
<p>In a star schema, every relationship between a dimension and a fact table should be <strong>one-to-many</strong>: one customer row in dim_customers relates to many order rows in fact_sales. This allows Power BI to filter the fact table correctly from the dimension — a customer slicer filters all their orders automatically.</p>
<h3>The Date Table is Mandatory</h3>
<p>For any model that includes time-based analysis, you <strong>must</strong> have a dedicated date dimension table. Power BI's built-in time intelligence functions (TOTALYTD, SAMEPERIODLASTYEAR, etc.) require a properly marked date table with a contiguous range of dates covering all dates in your fact table — no gaps allowed.</p>
<div class="callout callout-warn"><strong>Best practice:</strong> Disable Power BI's auto date/time feature (File → Options → Data Load → uncheck "Auto date/time") and create your own dim_date table. Auto date/time creates hidden tables for every date column — inflating model size.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>Describe the "one grain" principle for fact tables.</li><li>In a star schema, what type of cardinality should exist between a dimension and a fact table?</li><li>Why should integer surrogate keys be used in dimension-to-fact relationships?</li></ul></div>`
  },

<p>Understanding the structural role of each table type is essential for building a correct Power BI model.</p>
<h3>Fact Tables</h3>
<p>A fact table records business events or transactions. Each row is one occurrence of the measured event.</p>
<ul>
  <li><strong>Foreign keys</strong> — integer columns pointing to dimension tables (customer_id, product_id, date_id).</li>
  <li><strong>Additive measures</strong> — numeric columns you aggregate (revenue, quantity, cost). These are what DAX measures will SUM, COUNT, and AVERAGE.</li>
  <li><strong>No descriptive text</strong> — avoid storing product_name or customer_email in the fact table. Those belong in dimension tables.</li>
</ul>
<p>Example fact table (fact_sales):</p>
<pre><code>order_id | date_id | customer_id | product_id | revenue | quantity | profit
---------|---------|-------------|------------|---------|----------|-------
1001     | 20240115| 42          | 7          | 450.00  | 3        | 135.00
1002     | 20240116| 18          | 12         | 820.00  | 1        | 246.00</code></pre>
<h3>Dimension Tables</h3>
<p>Dimension tables contain descriptive attributes used for filtering, grouping, and labelling. They are typically much smaller than fact tables in row count.</p>
<ul>
  <li><strong>Primary key</strong> — one unique row per entity (one row per customer, one per product, one per date).</li>
  <li><strong>Descriptive attributes</strong> — text columns for filtering and display (customer_name, region, product_category, brand).</li>
  <li><strong>Wide and flat</strong> — flatten hierarchies into one table (dim_product has both product_name AND category AND subcategory in the same row — no separate category table).</li>
</ul>
<h3>The Date Dimension</h3>
<p>The date dimension is the most important dimension. It must contain one row per calendar day with no gaps. Required columns: date (as a Date type), year, quarter, month_number, month_name, week_number, day_of_week, is_weekend. Optional: fiscal_year, fiscal_quarter, is_holiday.</p>
<p>Create dim_date in DAX using <span class="inline-code">CALENDAR(DATE(2022,1,1), DATE(2026,12,31))</span> and extend it with <span class="inline-code">ADDCOLUMNS</span>. Then right-click the table in Model View → Mark as Date Table → select the date column.</p>
<div class="callout callout-tip"><strong>Tip:</strong> Create dim_date in Power Query (M language) so it regenerates dynamically based on your fact table's date range — no manual date range updates needed.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What two types of columns does a fact table contain?</li><li>Why should dimension tables be "wide and flat" rather than normalized into separate tables?</li><li>What DAX function creates a table with one row per calendar day?</li></ul></div>`

<p>Relationships are the connectors between tables. Getting them right determines whether filters flow correctly across your model.</p>
<h3>Creating Relationships in Model View</h3>
<p>Switch to <strong>Model View</strong> (the relationship diagram icon). To create a relationship:</p>
<ol>
  <li><strong>Drag-and-drop:</strong> Click and hold the foreign key column in the fact table (e.g. <span class="inline-code">customer_id</span> in fact_sales) and drag it onto the primary key column of the dimension (e.g. <span class="inline-code">customer_id</span> in dim_customers). Power BI creates the relationship and draws the connector line.</li>
  <li><strong>Manage Relationships dialog:</strong> Home tab → Manage Relationships → New. Select the two tables, pick the matching columns, and configure cardinality and cross-filter direction.</li>
  <li><strong>Auto-detect:</strong> Home → Manage Relationships → Autodetect. Power BI attempts to find matching column names. Always verify the results — auto-detection is not always correct.</li>
</ol>
<h3>Active vs. Inactive Relationships</h3>
<p>A model can have only one <strong>active</strong> relationship between two tables. The active relationship is used by default in all DAX calculations and visual filters. You can have additional <strong>inactive</strong> relationships (shown as dashed lines) and activate them selectively in DAX using <span class="inline-code">USERELATIONSHIP()</span>.</p>
<p>Example: fact_sales has both order_date and ship_date. You create two relationships to dim_date — one active (on order_date) and one inactive (on ship_date). A shipping analysis measure can use <span class="inline-code">USERELATIONSHIP(fact_sales[ship_date], dim_date[date])</span> to route filtering through the ship date instead.</p>
<h3>Editing and Deleting Relationships</h3>
<p>In Model View, double-click any relationship connector line to open the Edit Relationship dialog. You can change the cardinality, cross-filter direction, or the columns used. To delete a relationship, right-click the connector line → Delete.</p>
<div class="callout callout-info"><strong>Important:</strong> Deleting a relationship does not delete any data. It only removes the logical link between the tables. Filters from one table will no longer propagate to the other.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the difference between an active and inactive relationship in Power BI?</li><li>Which DAX function activates an inactive relationship within a measure calculation?</li><li>How many active relationships can exist between two tables at once?</li></ul></div>`

    badge: '',
    content: `
<p>Every relationship has two key settings: <strong>cardinality</strong> (how many rows on each side can match) and <strong>cross-filter direction</strong> (which table filters which).</p>
<h3>Cardinality Options</h3>
<ul>
  <li><strong>Many-to-One (*:1) / One-to-Many (1:*)</strong> — The standard star schema relationship. One row in the dimension matches many rows in the fact table. Power BI automatically sets this when the lookup side has unique values.</li>
  <li><strong>One-to-One (1:1)</strong> — Each value in both tables appears exactly once. Rare in star schemas; more common for bridging or splitting tables for performance reasons. Treat as a model smell — consider merging the tables.</li>
  <li><strong>Many-to-Many (*:*)</strong> — Multiple rows in both tables can match. Available in Power BI but requires caution. Common misuse: using a shared dimension column that has duplicates on both sides. Power BI will create an M:M automatically if the join column is not unique on either side — often a sign of missing surrogate keys.</li>
</ul>
<h3>Cross-Filter Direction</h3>
<ul>
  <li><strong>Single:</strong> Filters flow in one direction only — from the "one" side (dimension) to the "many" side (fact). This is the default and safest setting. Selecting "Electronics" in a product slicer filters the fact table to show only Electronics orders.</li>
  <li><strong>Both (bidirectional):</strong> Filters flow in both directions. Selecting an order in the fact table can also filter the dimension table. Use sparingly — bidirectional filtering can create ambiguous filter paths and slow performance in complex models.</li>
</ul>
<h3>When Bidirectional Makes Sense</h3>
<p>Bidirectional filtering is appropriate for <strong>bridge tables</strong> in many-to-many scenarios (e.g. a product-to-tag mapping table where products can have multiple tags and tags can apply to multiple products). For standard star schemas, always use Single direction.</p>
<div class="callout callout-warn"><strong>Ambiguity warning:</strong> If Power BI shows a yellow triangle on a relationship, it has detected a potential ambiguity — two different filter paths could produce different results for the same query. Always investigate and resolve these.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>In a standard star schema dimension-to-fact relationship, which cardinality setting is correct?</li><li>What is the default cross-filter direction and why is it preferred?</li><li>Give one legitimate use case for bidirectional cross-filter direction.</li></ul></div>`

    badge: '',
    content: `
<p>A well-modeled Power BI file loads faster, refreshes faster, and responds faster to user interactions. These best practices make a significant difference in real-world reports.</p>
<h3>Hide Unused Columns</h3>
<p>Right-click any column in Model View → Hide. Hidden columns are excluded from the Fields pane, reducing clutter. More importantly: <strong>columns hidden from report view are also excluded from Vertipaq's query scope</strong> during many aggregation operations — improving performance. Hide foreign key columns in the fact table (customer_id, product_id) — report authors should use the related name (customer_name from dim_customers), not the raw ID.</p>
<h3>Disable Auto Date/Time</h3>
<p>File → Options and settings → Options → Data Load → uncheck <strong>Auto date/time for new files</strong>. This prevents Power BI from creating a hidden date table for every date column in your model. A model with 5 date columns and auto date/time enabled has 5 hidden tables consuming memory — even if you never use them.</p>
<h3>Use Integer Surrogate Keys</h3>
<p>If your source data uses text keys ("CUST-NORTHWEST-ENT-042"), create an integer surrogate key in Power Query (Table.AddIndexColumn). Integer columns compress better in Vertipaq and join faster than string columns.</p>
<h3>Reduce Column Cardinality</h3>
<p>High-cardinality text columns (email addresses, free-text descriptions, GUIDs) compress poorly because Vertipaq cannot find many repeating values to encode. If a text column is not needed for filtering or grouping, hide it. If it's needed occasionally, consider loading it only in a dimension table (not repeated in every fact row).</p>
<h3>Avoid Calculated Columns Where Measures Suffice</h3>
<p>Calculated columns are computed at data refresh and stored in the model — consuming memory for every row. Measures are computed at query time on demand. If a value is only needed in a visual (not for filtering, grouping, or creating a relationship), use a measure. A model with 20 calculated columns adds 20 × (row count) stored values; 20 measures add zero stored values.</p>
<div class="callout callout-tip"><strong>Performance test:</strong> Use DAX Studio (free external tool) to run Vertipaq Analyzer and see each column's compressed size, cardinality, and memory usage — the fastest way to find optimization targets.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the impact of hiding columns from the report view on model performance?</li><li>Why should the "Auto date/time" option be disabled in production models?</li><li>What is the memory trade-off between calculated columns and measures?</li></ul></div>`

document.getElementById('signin-btn').addEventListener('click', () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {

});

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!user.email||!user.email.endsWith('@sourcefuse.com')) {
      document.getElementById('ep-error').textContent='Only @sourcefuse.com accounts are allowed.';
      document.getElementById('ep-error').style.display='block';
      await signOut(auth); return;
    }
    _uid=user.uid;
    _email=user.email;
    _name=user.displayName||user.email;
    document.getElementById('user-avatar').src=user.photoURL||'';

window.sfEmailSignIn = function() {
  const email=(document.getElementById('ep-email').value||'').trim().toLowerCase();
  const pwd=document.getElementById('ep-password').value||'';
  const errEl=document.getElementById('ep-error');
  errEl.style.display='none';

  if(!email.endsWith('@sourcefuse.com')){errEl.textContent='Only @sourcefuse.com accounts are allowed.';errEl.style.display='block';return;}
  signInWithEmailAndPassword(auth,email,pwd).catch(e=>{
    errEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'Incorrect password.'
      :(e.code==='auth/user-not-found')?'No account found for this email.':e.message;
    errEl.style.display='block';
  });
};

async function loadCompleted(){const snap=await getDoc(doc(db,'progress',_uid));_completed=snap.exists()?(snap.data()[MODULE_KEY]||[]):[];}
async function markComplete(id){
  if(!_uid||_completed.includes(id))return;
  _completed=[..._completed,id];
  const ref=doc(db,'progress',_uid);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{[MODULE_KEY]:_completed,updatedAt:serverTimestamp()});}
  else{await updateDoc(ref,{[MODULE_KEY]:arrayUnion(id),updatedAt:serverTimestamp()});}
  updateSectionUI(id);updateSidebarProgress();
  if(_completed.length>=SECTIONS.length) pbWriteModuleComplete();
}
function renderAll(){renderSections();renderNavItems();updateSidebarProgress();}
function renderSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const bh=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="section-block" id="block-${s.id}">
      <div class="section-header" onclick="toggleSection(${s.id})">
        <span class="section-num">${MODULE_NUM}.${s.id}</span>
        <span class="section-title">${s.title}</span>
        ${bh}${done?'<span style="color:#43A047;font-size:.85rem;">✓</span>':''}
        <span class="section-toggle" id="toggle-${s.id}">▼</span>
      </div>
      <div class="section-body" id="body-${s.id}">
        ${s.content}
        <button class="complete-btn ${done?'done':''}" id="complete-btn-${s.id}" onclick="handleMarkComplete(${s.id})" ${done?'disabled':''}>
          ${done?'✅ Completed':'✔ Mark as Completed'}
        </button>
        <span class="save-indicator" id="indicator-${s.id}"></span>
      </div>
    </div>`;
  }).join('');
  const fi=SECTIONS.find(s=>!_completed.includes(s.id));
  if(fi)toggleSection(fi.id);else if(SECTIONS.length>0)toggleSection(SECTIONS[0].id);
}
function renderNavItems(){
  const nav=document.getElementById('nav-items');
  nav.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const b=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="nav-item ${done?'completed':''}" id="nav-${s.id}" onclick="scrollToSection(${s.id})"><span>${MODULE_NUM}.${s.id} ${s.title}</span>${b}</div>`;
  }).join('');
}
function updateSidebarProgress(){const done=_completed.length;const pct=Math.round((done/SECTIONS.length)*100);document.getElementById('sidebar-bar').style.width=pct+'%';document.getElementById('sidebar-pct').textContent=pct+'%';}
function updateSectionUI(id){
  const btn=document.getElementById(`complete-btn-${id}`);const nav=document.getElementById(`nav-${id}`);const blk=document.getElementById(`block-${id}`);
  if(btn){btn.classList.add('done');btn.disabled=true;btn.textContent='✅ Completed';}
  if(nav)nav.classList.add('completed');
  const hdr=blk?.querySelector('.section-header');
  if(hdr&&!hdr.querySelector('.done-tick')){const tick=document.createElement('span');tick.className='done-tick';tick.style.cssText='color:#43A047;font-size:.85rem;';tick.textContent='✓';hdr.insertBefore(tick,hdr.querySelector('.section-toggle'));}
}
window.handleMarkComplete=async function(id){const btn=document.getElementById(`complete-btn-${id}`);if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Saving…';const ind=document.getElementById(`indicator-${id}`);if(ind)ind.textContent='Saving…';await markComplete(id);if(ind){ind.textContent='Saved ✓';setTimeout(()=>ind.textContent='',2000);}};
window.toggleSection=function(id){SECTIONS.forEach(s=>{const body=document.getElementById(`body-${s.id}`);const toggle=document.getElementById(`toggle-${s.id}`);const nav=document.getElementById(`nav-${s.id}`);if(s.id===id){const isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);toggle?.classList.toggle('open',!isOpen);nav?.classList.toggle('active',!isOpen);}else{body.classList.remove('open');toggle?.classList.remove('open');nav?.classList.remove('active');}});};
window.scrollToSection=function(id){toggleSection(id);document.getElementById(`block-${id}`)?.scrollIntoView({behavior:'smooth',block:'start'})};
window.markComplete=markComplete;

/* ===== PowerBI courseProgress v2 (module-complete write) ===== */
const PB_CP_COURSE_ID = 'MvS3hDfFbtKyCYVYWsQE';
const PB_MODULE_KEY_CP = 'powerbi-module-3';
const PB_MODULE_KEYS = ['powerbi-module-1','powerbi-module-2','powerbi-module-3','powerbi-module-4','powerbi-module-5','powerbi-module-6'];

async function pbWriteModuleComplete(){
  if(!_uid) return;
  try{
    const ref=doc(db,'courseProgress',_uid);
    const snap=await getDoc(ref);
    const data=snap.exists()?(snap.data()||{}):{};
    const course=(data.courses&&data.courses[PB_CP_COURSE_ID])||{};
    const mods=course.modules||{};
    const nowIso=new Date().toISOString();
    if(mods[PB_MODULE_KEY_CP]&&mods[PB_MODULE_KEY_CP].completedOn) return; // already recorded
    const courseUpdate={ modules:{} };
    courseUpdate.modules[PB_MODULE_KEY_CP]={ completedOn:nowIso, completedAt:serverTimestamp() };
    if(course.moduleInProgress===PB_MODULE_KEY_CP) courseUpdate.moduleInProgress=null;
    let doneCount=0;
    PB_MODULE_KEYS.forEach(function(k){ if(k===PB_MODULE_KEY_CP){doneCount++;return;} if(mods[k]&&mods[k].completedOn) doneCount++; });
    if(doneCount>=PB_MODULE_KEYS.length && !course.courseCompletedOn){ courseUpdate.courseCompletedOn=nowIso; courseUpdate.courseCompletedAt=serverTimestamp(); }
    if(!snap.exists()){
      await setDoc(ref,{ email:_email, name:_name, courseStartedOn:nowIso, courseStartedAt:serverTimestamp(),
        courses:{ [PB_CP_COURSE_ID]: Object.assign({}, courseUpdate) } });
    }else{
      const upd={ email:_email, name:_name, courses:{} };
      upd.courses[PB_CP_COURSE_ID]=courseUpdate;
      if(!data.courseStartedOn && !course.courseStartedOn){ upd.courses[PB_CP_COURSE_ID].courseStartedOn=nowIso; upd.courses[PB_CP_COURSE_ID].courseStartedAt=serverTimestamp(); }
      await setDoc(ref, upd, { merge:true });
    }
  }catch(e){ console.warn('[powerbi] courseProgress write failed:', e.message); }
}
