    id: 1,
    title: 'Introduction to DAX',
    badge: '',
    content: `
<p><strong>DAX (Data Analysis Expressions)</strong> is the formula language of Power BI, Power Pivot, and Azure Analysis Services. It was designed from the ground up for <em>aggregate calculations over tables</em> — very different from cell-based spreadsheet formulas.</p>
<h3>Where DAX is Used</h3>
<ul>
  <li><strong>Measures</strong> — aggregated calculations evaluated on demand in the context of whatever visual, filter, or slicer is active. Written in the Fields pane under a table.</li>
  <li><strong>Calculated Columns</strong> — row-by-row calculations stored in the model table as a new column. Computed at refresh, stored in Vertipaq.</li>
  <li><strong>Calculated Tables</strong> — entire tables generated by a DAX expression (e.g. CALENDAR(), SUMMARIZE(), CROSSJOIN()). Computed at refresh and stored.</li>
</ul>
<h3>DAX Syntax Basics</h3>
<p>DAX syntax uses square brackets for column references and single quotes for table names:</p>
<pre><code>Total Revenue = SUM(fact_sales[revenue])
Profit Margin % = DIVIDE(SUM(fact_sales[profit]), SUM(fact_sales[revenue]), 0)</code></pre>
<p>Key conventions:</p>
<ul>
  <li>Column references: <span class="inline-code">TableName[ColumnName]</span> — always include the table name in measures to avoid ambiguity.</li>
  <li>Measure references: <span class="inline-code">[MeasureName]</span> — measures are referenced without a table name in the square brackets.</li>
  <li>Function names are case-insensitive: SUM, Sum, sum all work — but uppercase is the convention.</li>
  <li>DAX is context-sensitive — the same measure can return different values in different visual contexts.</li>
</ul>
<h3>DAX vs Excel Formulas</h3>
<p>Excel formulas reference cells (=A1+B1). DAX formulas reference columns and tables. In Excel, SUM(A1:A10) sums 10 specific cells. In DAX, SUM(fact_sales[revenue]) sums all rows in the revenue column that are visible in the current filter context — which changes dynamically as users interact with slicers and visuals.</p>
<div class="callout callout-info"><strong>Key mindset shift:</strong> In Excel, you think "which cells?" In DAX, you think "which rows are visible right now, and what do I want to calculate over them?"</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the difference between a DAX measure and a calculated column in terms of when they are computed?</li><li>Write the correct syntax to reference the revenue column in fact_sales inside a DAX measure.</li><li>Why does the same DAX measure return different values in different rows of a matrix visual?</li></ul></div>`

    badge: '',
    content: `
<p>Choosing correctly between a measure and a calculated column is one of the most important DAX decisions. The wrong choice leads to incorrect results, poor performance, or both.</p>
<h3>Calculated Columns</h3>
<p>A calculated column is a new column added to a table via DAX. It is evaluated <strong>row by row</strong> at data refresh and the results are stored in the Vertipaq engine for every row.</p>
<pre><code>-- Calculated column in fact_sales
Profit Margin Per Row = DIVIDE(fact_sales[profit], fact_sales[revenue], 0)</code></pre>
<p>Use calculated columns when you need to:</p>
<ul>
  <li><strong>Slice or filter by the result</strong> — a column can be placed in a slicer or used as a row/column in a matrix. A measure cannot.</li>
  <li><strong>Use RELATED to look up a value from a dimension</strong> — e.g. add customer_region to the fact table for row-level segmentation: <span class="inline-code">Customer Region = RELATED(dim_customers[region])</span></li>
  <li><strong>Create a category bucket</strong> — e.g. label orders as "High Value" / "Standard" based on revenue amount.</li>
</ul>
<h3>Measures</h3>
<p>A measure is a DAX formula that is evaluated <strong>on demand</strong> based on the current filter context of the visual requesting it. Measures store no data — they compute a result at query time and discard it.</p>
<pre><code>Total Revenue    = SUM(fact_sales[revenue])
Profit Margin %  = DIVIDE([Total Revenue], SUM(fact_sales[profit]), 0)
Avg Order Value  = AVERAGEX(fact_sales, fact_sales[revenue])</code></pre>
<p>Use measures when you need to:</p>
<ul>
  <li><strong>Aggregate</strong> — any SUM, COUNT, AVERAGE, MIN, MAX of a column.</li>
  <li><strong>Compare across contexts</strong> — % of total, year-over-year, running totals.</li>
  <li><strong>Anything that needs to respond to slicer selections</strong> — measures always recalculate based on what the user has filtered.</li>
</ul>
<h3>The Decision Rule</h3>
<div class="callout callout-warn"><strong>If in doubt, use a measure.</strong> Measures add zero rows to the model and compute only when needed. Calculated columns add (row count × 1 value) of stored data for every row. On a 10-million-row fact table, one unnecessary calculated column wastes 10 million stored values.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>A calculated column vs a measure: which is stored in the model, and which is computed on demand?</li><li>You need to use region as a slicer on a dashboard. Should you create a calculated column or a measure to add it to the fact table?</li><li>You need to show total revenue that responds to a date slicer. Which type of DAX object is correct?</li></ul></div>`

    badge: '',
    content: `
<p>Understanding evaluation context is the single most important concept in DAX. Without it, calculated columns and measures produce confusing results that seem to contradict each other.</p>
<h3>Row Context</h3>
<p>Row context exists during the evaluation of a <strong>calculated column</strong>. When Power BI evaluates a calculated column, it processes each row one at a time — the "current row" is known. You can reference column values directly:</p>
<pre><code>-- This works in a calculated column — row context provides the current row's values
Profit Per Unit = fact_sales[profit] / fact_sales[quantity]</code></pre>
<p>Row context does <em>not</em> automatically see related tables. To pull a value from a related dimension in a calculated column, use <span class="inline-code">RELATED()</span>:</p>
<pre><code>Customer Region = RELATED(dim_customers[region])  -- follows the relationship to dim_customers</code></pre>
<h3>Filter Context</h3>
<p>Filter context exists during the evaluation of a <strong>measure</strong>. There is no "current row" — the measure sees only the <em>set of rows</em> that pass all active filters (slicers, row/column headers, visual filters, page filters). The measure aggregates over that set.</p>
<pre><code>Total Revenue = SUM(fact_sales[revenue])
-- In a matrix with region = "North" in the row header:
-- Filter context = { region = "North" }
-- SUM runs over only North region rows</code></pre>
<h3>Context Transition</h3>
<p>When you call <span class="inline-code">CALCULATE()</span> inside a row context (e.g. inside SUMX iteration), the row context is converted into a filter context. This is called <strong>context transition</strong> and is how iterating functions interact with measures.</p>
<pre><code>-- SUMX iterates row by row (row context), then calls CALCULATE → context transition
Revenue with Context Transition =
  SUMX(fact_sales, CALCULATE(SUM(fact_sales[revenue])))</code></pre>
<div class="callout callout-info"><strong>Summary:</strong> Row context = "I know which row I'm on" (calculated columns, iterators). Filter context = "I know which rows are visible" (measures, CALCULATE).</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>In which type of DAX object does row context exist by default?</li><li>How do you access a column from a related table inside a calculated column?</li><li>What happens to row context when CALCULATE() is called inside an iterator function?</li></ul></div>`

    content: `
<p><span class="inline-code">CALCULATE</span> is the most important and most powerful function in DAX. It evaluates an expression in a <strong>modified filter context</strong>. Nearly all advanced DAX is built on CALCULATE.</p>
<h3>CALCULATE Syntax</h3>
<pre><code>CALCULATE( &lt;expression&gt;, &lt;filter1&gt;, &lt;filter2&gt;, ... )</code></pre>
<ul>
  <li><strong>&lt;expression&gt;</strong> — any DAX expression or measure to evaluate.</li>
  <li><strong>&lt;filter1&gt;, &lt;filter2&gt;, ...</strong> — one or more filter modifiers that change the filter context before evaluating the expression.</li>
</ul>
<h3>Common Filter Modifiers</h3>
<ul>
  <li><strong>ALL(table)</strong> — removes all filters from the specified table.</li>
  <li><strong>ALL(table[column])</strong> — removes filters only from the specified column.</li>
  <li><strong>ALLEXCEPT(table, col1, col2)</strong> — removes all filters except those on the specified columns.</li>
  <li><strong>ALLSELECTED(table)</strong> — removes internal filters but respects the outermost filter context (the visual's slicers). Used for "% of selection" calculations.</li>
  <li><strong>FILTER(table, condition)</strong> — adds a row-by-row filter condition.</li>
  <li><strong>KEEPFILTERS(expression)</strong> — adds rather than replaces a filter.</li>
</ul>
<h3>Example: % of Total</h3>
<pre><code>Revenue % of Total =
DIVIDE(
  [Total Revenue],
  CALCULATE([Total Revenue], ALL(dim_customers))
)</code></pre>
<p>Without ALL, both numerator and denominator would filter by whatever the visual's row context shows — giving 100% for every row. ALL removes the customer filter from the denominator, computing the company-wide total.</p>
<h3>Example: Filter by Condition</h3>
<pre><code>Revenue High Value Orders =
CALCULATE(
  SUM(fact_sales[revenue]),
  fact_sales[revenue] > 500
)</code></pre>
<div class="callout callout-warn"><strong>Remember:</strong> CALCULATE always evaluates its filter arguments first, modifies the context, then evaluates the expression. The order matters — filters are applied before the expression runs.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What does ALL(dim_customers) do when used as a CALCULATE filter modifier?</li><li>Write a CALCULATE expression that computes total revenue for only the "Electronics" category.</li><li>What is the difference between ALL() and ALLSELECTED() in a % of total measure?</li></ul></div>`

    badge: '',
    content: `
<p>DAX has two families of aggregation functions: <strong>simple aggregators</strong> (SUM, COUNT, AVERAGE) that aggregate one column, and <strong>iterator functions</strong> (SUMX, COUNTX, AVERAGEX) that iterate row by row and evaluate an expression per row before aggregating.</p>
<h3>Simple Aggregators</h3>
<pre><code>Total Revenue  = SUM(fact_sales[revenue])
Order Count    = COUNTROWS(fact_sales)       -- counts rows (preferred over COUNT for tables)
Unique Custmrs = DISTINCTCOUNT(fact_sales[customer_id])
Avg Revenue    = AVERAGE(fact_sales[revenue])
Min Order Date = MIN(fact_sales[order_date])</code></pre>
<p>Use COUNTROWS(table) rather than COUNT(column) — COUNTROWS counts all rows including those with null values in any specific column, and is more explicit about intent.</p>
<h3>Iterator Functions (X-functions)</h3>
<p>Iterator functions take a table as their first argument and an expression as the second. They iterate over each row of the table (establishing row context), evaluate the expression per row, and then aggregate all the results.</p>
<pre><code>-- Revenue per order × quantity margin, then summed
Weighted Revenue = SUMX(fact_sales, fact_sales[revenue] * fact_sales[quantity])

-- Average profit margin per order (not average of the column — proper per-row calculation)
Avg Profit Margin = AVERAGEX(fact_sales, DIVIDE(fact_sales[profit], fact_sales[revenue], 0))</code></pre>
<h3>DIVIDE — Safe Division</h3>
<p>Always use <span class="inline-code">DIVIDE(numerator, denominator, alternate_result)</span> instead of the / operator. DIVIDE returns the alternate result (default 0) when the denominator is zero or blank — avoiding division-by-zero errors that would show ERROR in the visual.</p>
<pre><code>Profit Margin % = DIVIDE(SUM(fact_sales[profit]), SUM(fact_sales[revenue]), 0)</code></pre>
<h3>IF and IFERROR</h3>
<pre><code>-- Conditional measure
Revenue Category =
IF([Total Revenue] > 100000, "High", IF([Total Revenue] > 50000, "Mid", "Low"))

-- Trap errors in a measure (use sparingly — prefer DIVIDE for division)
Safe Calc = IFERROR([Complex Measure], 0)</code></pre>
<div class="callout callout-tip"><strong>SUMX vs SUM:</strong> SUM(column) is faster because it uses Vertipaq's columnar storage directly. SUMX(table, expression) creates row context and evaluates an expression per row — more flexible but slower on large tables. Use SUM whenever the column already contains the values you need to sum.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the difference between SUM(column) and SUMX(table, expression)?</li><li>Why is DIVIDE() preferred over the / operator in DAX?</li><li>Write a measure that counts the distinct number of customers in fact_sales.</li></ul></div>`

<p>Time intelligence functions compute calculations relative to calendar periods — year-to-date, period-over-period comparisons, running totals. They are among the most used DAX functions in business reporting.</p>
<h3>Date Table Requirement</h3>
<p>All time intelligence functions require a <strong>marked Date Table</strong> in your model — a table with one row per calendar day with no gaps, and the date column set as the key. Without it, functions like TOTALYTD and SAMEPERIODLASTYEAR return errors or incorrect results.</p>
<h3>Period-to-Date Functions</h3>
<pre><code>Revenue YTD = TOTALYTD([Total Revenue], dim_date[date])
Revenue QTD = TOTALQTD([Total Revenue], dim_date[date])
Revenue MTD = TOTALMTD([Total Revenue], dim_date[date])</code></pre>
<p>TOTALYTD resets to zero on the first day of each new year (or the first day of your fiscal year if you pass a fiscal year-end date as the third argument).</p>
<h3>Period-over-Period Comparisons</h3>
<pre><code>Revenue LY = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR(dim_date[date]))

Revenue YoY Growth =
DIVIDE([Total Revenue] - [Revenue LY], [Revenue LY], 0)

Revenue Prior Month = CALCULATE([Total Revenue], PREVIOUSMONTH(dim_date[date]))</code></pre>
<h3>DATEADD — Flexible Date Offsets</h3>
<pre><code>Revenue 3 Months Ago =
CALCULATE([Total Revenue], DATEADD(dim_date[date], -3, MONTH))</code></pre>
<p>DATEADD shifts the date context by a specified number of intervals (DAY, MONTH, QUARTER, YEAR). Use negative values to go back in time, positive to go forward.</p>
<h3>Running Total</h3>
<pre><code>Revenue Running Total =
CALCULATE(
  [Total Revenue],
  DATESYTD(dim_date[date])
)</code></pre>
<div class="callout callout-info"><strong>Fiscal year tip:</strong> Pass a fiscal year-end as the third argument to TOTALYTD and DATESYTD: <span class="inline-code">TOTALYTD([Total Revenue], dim_date[date], "3/31")</span> uses March 31 as the fiscal year-end (common in many Asia-Pacific organisations).</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>What is the prerequisite for using time intelligence functions like TOTALYTD?</li><li>Write the DAX measure that computes revenue for the same period in the previous year.</li><li>What does DATEADD(dim_date[date], -1, YEAR) return in a filter context?</li></ul></div>`

<p>These are the most frequently used DAX patterns in real-world Power BI reports. Mastering these covers the majority of business reporting requirements.</p>
<h3>% of Total (with ALL)</h3>
<pre><code>Revenue % of Total =
DIVIDE(
  [Total Revenue],
  CALCULATE([Total Revenue], ALL(fact_sales))
, 0)</code></pre>
<h3>% of Parent (with ALLEXCEPT)</h3>
<pre><code>Revenue % of Category =
DIVIDE(
  [Total Revenue],
  CALCULATE([Total Revenue], ALLEXCEPT(dim_product, dim_product[category]))
, 0)</code></pre>
<h3>Cumulative Total (Running Sum)</h3>
<pre><code>Cumulative Revenue =
CALCULATE(
  [Total Revenue],
  FILTER(
    ALL(dim_date[date]),
    dim_date[date] <= MAX(dim_date[date])
  )
)</code></pre>
<h3>RANKX — Dynamic Ranking</h3>
<pre><code>Customer Revenue Rank =
RANKX(
  ALL(dim_customers[customer_name]),
  [Total Revenue],
  ,
  DESC,
  DENSE
)</code></pre>
<p>RANKX iterates over all customers (ALL removes the filter), evaluates Total Revenue for each, and returns the rank of the current customer from highest (1) to lowest.</p>
<h3>VAR…RETURN — Readable Multi-Step Measures</h3>
<pre><code>Profit Margin with Label =
VAR Rev = [Total Revenue]
VAR Prof = SUM(fact_sales[profit])
VAR Margin = DIVIDE(Prof, Rev, 0)
RETURN
  IF(Margin >= 0.3, "High (" & FORMAT(Margin, "0%") & ")",
  IF(Margin >= 0.15, "Mid (" & FORMAT(Margin, "0%") & ")",
  "Low (" & FORMAT(Margin, "0%") & ")"))
</code></pre>
<p>VAR…RETURN is the recommended pattern for complex measures. Variables are evaluated once (not recalculated on every reference), improving both performance and readability.</p>
<div class="callout callout-tip"><strong>Always use VAR…RETURN</strong> for measures with more than 2 sub-calculations. It prevents the same sub-expression from being computed multiple times and makes the logic easy to read and debug.</div>
<div class="test-questions"><h4>🎯 Likely Exam Questions</h4><ul><li>Why is VAR…RETURN preferred over repeating sub-expressions in a DAX measure?</li><li>Write a RANKX expression that ranks customers by Total Revenue from highest to lowest.</li><li>What does ALL(fact_sales) do when used in a CALCULATE inside a % of total measure?</li></ul></div>`

let _uid = null, _completed = [];

document.getElementById('signin-btn').addEventListener('click', () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
    document.getElementById('ep-error').textContent = e.message||'Sign-in failed.';
    document.getElementById('ep-error').style.display='block';
  });
});
document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (user) {
    if (!user.email||!user.email.endsWith('@sourcefuse.com')) {
      document.getElementById('ep-error').textContent='Only @sourcefuse.com accounts are allowed.';
      document.getElementById('ep-error').style.display='block';
      await signOut(auth); return;
    }
    _uid=user.uid;
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    document.getElementById('auth-overlay').style.display='none';
    document.getElementById('loading-overlay').style.display='flex';
    await loadCompleted();
    document.getElementById('loading-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  } else {
    _uid=null;
    document.getElementById('app').style.display='none';
    document.getElementById('auth-overlay').style.display='flex';
  }
});

window.sfEmailSignIn = function() {
  const email=(document.getElementById('ep-email').value||'').trim().toLowerCase();
  const pwd=document.getElementById('ep-password').value||'';
  const errEl=document.getElementById('ep-error');
  errEl.style.display='none';
  if(!email||!pwd){errEl.textContent='Please enter your email and password.';errEl.style.display='block';return;}
  if(!email.endsWith('@sourcefuse.com')){errEl.textContent='Only @sourcefuse.com accounts are allowed.';errEl.style.display='block';return;}
  signInWithEmailAndPassword(auth,email,pwd).catch(e=>{
    errEl.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'Incorrect password.'
      :(e.code==='auth/user-not-found')?'No account found for this email.':e.message;
    errEl.style.display='block';
  });
};

async function loadCompleted(){const snap=await getDoc(doc(db,'progress',_uid));_completed=snap.exists()?(snap.data()[MODULE_KEY]||[]):[];}
async function markComplete(id){
  if(!_uid||_completed.includes(id))return;
  _completed=[..._completed,id];
  const ref=doc(db,'progress',_uid);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{[MODULE_KEY]:_completed,updatedAt:serverTimestamp()});}
  else{await updateDoc(ref,{[MODULE_KEY]:arrayUnion(id),updatedAt:serverTimestamp()});}
  updateSectionUI(id);updateSidebarProgress();
}
function renderAll(){renderSections();renderNavItems();updateSidebarProgress();}
function renderSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const bh=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="section-block" id="block-${s.id}">
      <div class="section-header" onclick="toggleSection(${s.id})">
        <span class="section-num">${MODULE_NUM}.${s.id}</span>
        <span class="section-title">${s.title}</span>
        ${bh}${done?'<span style="color:#43A047;font-size:.85rem;">✓</span>':''}
        <span class="section-toggle" id="toggle-${s.id}">▼</span>
      </div>
      <div class="section-body" id="body-${s.id}">
        ${s.content}
        <button class="complete-btn ${done?'done':''}" id="complete-btn-${s.id}" onclick="handleMarkComplete(${s.id})" ${done?'disabled':''}>
          ${done?'✅ Completed':'✔ Mark as Completed'}
        </button>
        <span class="save-indicator" id="indicator-${s.id}"></span>
      </div>
    </div>`;
  }).join('');
  const fi=SECTIONS.find(s=>!_completed.includes(s.id));
  if(fi)toggleSection(fi.id);else if(SECTIONS.length>0)toggleSection(SECTIONS[0].id);
}
function renderNavItems(){
  const nav=document.getElementById('nav-items');
  nav.innerHTML=SECTIONS.map(s=>{
    const done=_completed.includes(s.id);
    const b=s.badge?`<span class="nav-badge ${BADGE_CLASSES[s.badge]}">${BADGES[s.badge]}</span>`:'';
    return `<div class="nav-item ${done?'completed':''}" id="nav-${s.id}" onclick="scrollToSection(${s.id})"><span>${MODULE_NUM}.${s.id} ${s.title}</span>${b}</div>`;
  }).join('');
}
function updateSidebarProgress(){const done=_completed.length;const pct=Math.round((done/SECTIONS.length)*100);document.getElementById('sidebar-bar').style.width=pct+'%';document.getElementById('sidebar-pct').textContent=pct+'%';}
function updateSectionUI(id){
  const btn=document.getElementById(`complete-btn-${id}`);const nav=document.getElementById(`nav-${id}`);const blk=document.getElementById(`block-${id}`);
  if(btn){btn.classList.add('done');btn.disabled=true;btn.textContent='✅ Completed';}
  if(nav)nav.classList.add('completed');
  const hdr=blk?.querySelector('.section-header');
  if(hdr&&!hdr.querySelector('.done-tick')){const tick=document.createElement('span');tick.className='done-tick';tick.style.cssText='color:#43A047;font-size:.85rem;';tick.textContent='✓';hdr.insertBefore(tick,hdr.querySelector('.section-toggle'));}
}
window.handleMarkComplete=async function(id){const btn=document.getElementById(`complete-btn-${id}`);if(!btn||btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Saving…';const ind=document.getElementById(`indicator-${id}`);if(ind)ind.textContent='Saving…';await markComplete(id);if(ind){ind.textContent='Saved ✓';setTimeout(()=>ind.textContent='',2000);}};
window.toggleSection=function(id){SECTIONS.forEach(s=>{const body=document.getElementById(`body-${s.id}`);const toggle=document.getElementById(`toggle-${s.id}`);const nav=document.getElementById(`nav-${s.id}`);if(s.id===id){const isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);toggle?.classList.toggle('open',!isOpen);nav?.classList.toggle('active',!isOpen);}else{body.classList.remove('open');toggle?.classList.remove('open');nav?.classList.remove('active');}});};
window.scrollToSection=function(id){toggleSection(id);document.getElementById(`block-${id}`)?.scrollIntoView({behavior:'smooth',block:'start'})};
window.markComplete=markComplete;
</script>
